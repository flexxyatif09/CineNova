name: CineNova Auto-Publish Movies & Series

on:
  # Har 2 ghante me automatically chalega (100% Free on GitHub Actions - No Render Needed)
  schedule:
    - cron: '0 */2 * * *'
  # GitHub Actions tab se 1-click manual run ke liye
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target Movie Website URL (e.g. https://new2.movies4u.garden)'
        required: false
        default: 'https://new2.movies4u.garden'
      max_items:
        description: 'Max new movies & series to check per run'
        required: false
        default: '15'

jobs:
  sync-catalog-to-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper firebase-admin lxml

      - name: Scrape Movies & Series (Multi-Episode + Auto-Backfill) & Publish to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_ID: "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841"
          MOVIES_SITE_URL: ${{ github.event.inputs.site_url || vars.MOVIES_SITE_URL || 'https://new2.movies4u.garden' }}
          MAX_MOVIES_PER_RUN: ${{ github.event.inputs.max_items || '15' }}
        run: |
          if [ -f "automation/sync_movies.py" ]; then
            echo "Running automation/sync_movies.py ..."
            python3 automation/sync_movies.py
          else
            python3 - << 'EOF'
          import html
          import json
          import os
          import re
          import sys
          from urllib.parse import quote_plus, urljoin
          import cloudscraper
          from bs4 import BeautifulSoup
          import firebase_admin
          from firebase_admin import credentials, firestore

          DEFAULT_SITE_URL = os.environ.get("MOVIES_SITE_URL", "https://new2.movies4u.garden").rstrip("/")
          FIREBASE_DATABASE_ID = os.environ.get(
              "FIREBASE_DATABASE_ID",
              "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841"
          )
          MAX_MOVIES_PER_RUN = int(os.environ.get("MAX_MOVIES_PER_RUN", "15"))

          USER_AGENT = (
              "Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/126.0.0.0 Mobile Safari/537.36"
          )

          def create_http_session():
              scraper = cloudscraper.create_scraper(
                  browser={"browser": "chrome", "platform": "android", "desktop": False}
              )
              scraper.headers.update({
                  "User-Agent": USER_AGENT,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
              })
              return scraper

          def init_firestore_db():
              raw_sa = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "").strip()
              if not raw_sa:
                  print("ERROR: FIREBASE_SERVICE_ACCOUNT secret is missing in GitHub Settings -> Secrets -> Actions!")
                  sys.exit(1)
              sa_info = json.loads(raw_sa)
              print(f"Authenticated with Firebase Project: {sa_info.get('project_id')}")
              cred = credentials.Certificate(sa_info)
              if not firebase_admin._apps:
                  firebase_admin.initialize_app(cred)

              candidates = [
                  FIREBASE_DATABASE_ID,
                  "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841",
                  "(default)",
              ]
              seen = set()
              for db_id in candidates:
                  if not db_id or db_id in seen:
                      continue
                  seen.add(db_id)
                  try:
                      client = firestore.client(database_id=db_id)
                      list(client.collection("titles").limit(1).stream())
                      print(f"Successfully connected to Firestore Database ID: '{db_id}'")
                      return client
                  except Exception as e:
                      print(f"[Info] Database '{db_id}' not accessible ({e}), trying next...")

              raise RuntimeError("Could not connect to any Firestore database in this project!")

          def clean_movie_title_and_year(raw_title: str):
              text = html.unescape(re.sub(r"<[^>]+>", "", raw_title)).strip()
              is_series = bool(re.search(r"\b(Season\s*\d+|S\d{1,2}|Complete\s+Series|Episodes?|Ep-?\d+|Web\s*Series|Reality\s+Show|K-Drama|TV\s*Show)\b", text, re.I))
              year_match = re.search(r"\b(19[89]\d|20[0-3]\d)\b", text)
              year = int(year_match.group(1)) if year_match else 2026
              season_match = re.search(r"\b(?:Season|S)\s*(\d{1,2})\b", text, re.I)
              season_number = int(season_match.group(1)) if season_match else 1
              language = "Hindi"
              if re.search(r"Multi\s*Audio|Dual\s*Audio", text, re.I):
                  language = "Hindi (Multi Audio)"
              elif re.search(r"\bEnglish\b", text, re.I) and not re.search(r"\bHindi\b", text, re.I):
                  language = "English"
              clean = re.split(
                  r"\(\s*(?:19|20)\d{2}\s*\)|\[|480p|720p|1080p|2160p|4K|WEB-DL|HDRip|BluRay|HEVC|Download|Season\s*\d+|\bS\d{1,2}\b",
                  text, maxsplit=1, flags=re.I
              )[0]
              clean = re.sub(r"[-–:|]+$", "", clean).strip() or text[:60].strip()
              return clean, year, language, ("series" if is_series else "movie"), season_number

          def normalize_key(title: str, year: int) -> str:
              slug = re.sub(r"[^a-z0-9]+", "_", title.lower()).strip("_")
              return f"{slug}_{year}"

          def extract_poster_from_html(post_html: str) -> str:
              og_m = re.search(r'property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']', post_html, re.I)
              if og_m and og_m.group(1).startswith("http"):
                  return og_m.group(1).strip()
              tmdb_m = re.search(r'(https://image\.tmdb\.org/t/p/[^"\'\s>]+)', post_html, re.I)
              if tmdb_m:
                  return tmdb_m.group(1).strip()
              return ""

          def extract_multi_hop_links(session, post_url: str, post_html: str):
              soup = BeautifulSoup(post_html, "lxml")
              step1_candidates = []
              for a in soup.find_all("a", href=True):
                  href = urljoin(post_url, a["href"].strip())
                  txt = a.get_text(" ", strip=True)
                  if any(k in href.lower() for k in ("m4ulinks", "hubcloud", "vcloud", "gdflix")) or "download links" in txt.lower():
                      if not href.startswith("#") and not href.startswith("javascript:") and "/drive/admin" not in href.lower():
                          step1_candidates.append(href)
              if not step1_candidates:
                  return None

              current_url = step1_candidates[len(step1_candidates) // 2]
              if "m4ulinks" in current_url.lower():
                  try:
                      r2 = session.get(current_url, headers={"Referer": post_url}, timeout=12)
                      if r2.ok:
                          s2 = BeautifulSoup(r2.text, "lxml")
                          hub_links = [
                              urljoin(current_url, a["href"].strip())
                              for a in s2.find_all("a", href=True)
                              if ("hubcloud" in a["href"].lower() or "vcloud" in a["href"].lower() or "hub-cloud" in a.get_text(" ", strip=True).lower())
                              and "/drive/admin" not in a["href"].lower()
                          ]
                          if hub_links:
                              current_url = hub_links[len(hub_links) // 2]
                  except Exception as e:
                      print(f"  [Warn] Hop 2 error: {e}")

              return current_url

          def extract_all_episodes(session, post_url: str, post_html: str):
              soup = BeautifulSoup(post_html, "lxml")
              m4u_links = []
              for a in soup.find_all("a", href=True):
                  href = urljoin(post_url, a["href"].strip())
                  if "m4ulinks" in href.lower() and "/drive/admin" not in href.lower():
                      if href not in m4u_links:
                          m4u_links.append(href)

              extra_m4u = re.findall(r"href=[\x27\"](https?://[^\x27\"<>]*m4ulinks[^\x27\"<>]*)[\x27\"]", post_html, re.I)
              for u in extra_m4u:
                  if u not in m4u_links and "/drive/admin" not in u.lower():
                      m4u_links.append(u)

              all_episodes = {}
              for m4u_url in m4u_links:
                  try:
                      r = session.get(m4u_url, headers={"Referer": post_url}, timeout=15)
                      if not r.ok:
                          continue
                      html_text = r.text
                      cur_eps = {}
                      parts = re.split(
                          r"(-:Episodes?:\s*\d+:-|<h5>\s*Episode\s*\d+\s*</h5>|Episode\s*[:\-]?\s*\d+|Ep\s*[:\-]?\s*\d+)",
                          html_text,
                          flags=re.I,
                      )
                      if len(parts) > 1:
                          for i in range(1, len(parts), 2):
                              header = parts[i]
                              chunk = parts[i + 1] if i + 1 < len(parts) else ""
                              num_m = re.search(r"\d+", header)
                              if not num_m:
                                  continue
                              ep_num = int(num_m.group(0))
                              hc = re.search(r"href=[\x27\"](https?://(?:hubcloud|gdflix|vcloud)\.[^\x27\"<>]+)[\x27\"]", chunk)
                              if hc and "/drive/admin" not in hc.group(1):
                                  cur_eps[ep_num] = hc.group(1)

                      if len(cur_eps) <= 1:
                          hc_links = re.findall(r"href=[\x27\"](https?://hubcloud\.[^\x27\"<>]+)[\x27\"]", html_text)
                          valid = [l for l in hc_links if "/drive/admin" not in l]
                          for idx, l in enumerate(valid, 1):
                              if idx not in cur_eps:
                                  cur_eps[idx] = l

                      for k, v in cur_eps.items():
                          if k not in all_episodes:
                              all_episodes[k] = v

                      if len(all_episodes) >= 2:
                          print(f"  [Series] Found {len(all_episodes)} episodes from {m4u_url}")
                  except Exception as e:
                      print(f"  [Warn] Failed parsing episodes from {m4u_url}: {e}")

              return all_episodes

          def publish_series_episodes(titles_ref, doc_id: str, clean_title: str, season_number: int, poster: str, episodes_map: dict):
              if not episodes_map:
                  return 0
              episodes_col = titles_ref.document(doc_id).collection("episodes")
              published_count = 0
              for ep_num in sorted(episodes_map.keys()):
                  ep_link = episodes_map[ep_num]
                  ep_doc_id = f"ep_s{season_number}_e{ep_num}"
                  episodes_col.document(ep_doc_id).set({
                      "titleId": doc_id,
                      "authorId": "github_automation",
                      "seasonNumber": season_number,
                      "episodeNumber": ep_num,
                      "title": f"Episode {ep_num}",
                      "synopsis": f"Watch Episode {ep_num} of {clean_title} (Season {season_number}).",
                      "thumbnail": poster,
                      "duration": "45m",
                      "durationMs": 2700000,
                      "videoUrl": ep_link[:500],
                      "subtitles": ["English", "Hindi"],
                      "isPublished": True,
                      "createdAt": firestore.SERVER_TIMESTAMP,
                      "updatedAt": firestore.SERVER_TIMESTAMP,
                  }, merge=True)
                  published_count += 1
              return published_count

          def backfill_existing_series_without_episodes(session, base_url: str, titles_ref):
              print("Checking existing web series in Firestore for missing episodes...")
              for doc in titles_ref.stream():
                  d = doc.to_dict() or {}
                  t_name = str(d.get("title", "")).strip()
                  t_type = str(d.get("type", "movie")).strip()
                  is_series = (t_type == "series") or bool(
                      re.search(r"\b(Season|S\d{1,2}|Series|Episodes?|Show|K-Drama|Bigg\s*Boss)\b", t_name, re.I)
                  )
                  if not is_series or not t_name:
                      continue

                  existing_eps = list(titles_ref.document(doc.id).collection("episodes").limit(3).stream())
                  if len(existing_eps) > 1:
                      continue

                  print(f"  [Backfill] Series '{t_name}' ({doc.id}) has only {len(existing_eps)} episode(s). Searching {base_url} ...")
                  try:
                      search_url = f"{base_url}/wp-json/wp/v2/posts?search={quote_plus(t_name)}&per_page=5"
                      resp = session.get(search_url, timeout=15)
                      if not resp.ok:
                          continue
                      for item in resp.json():
                          post_link = item.get("link", "")
                          raw_title = item.get("title", {}).get("rendered", "")
                          if not post_link:
                              continue
                          pr = session.get(post_link, timeout=15)
                          if not pr.ok:
                              continue
                          _, _, _, _, season_number = clean_movie_title_and_year(raw_title)
                          eps_map = extract_all_episodes(session, post_link, pr.text)
                          if eps_map:
                              poster = str(d.get("poster") or extract_poster_from_html(pr.text) or "drawable://img_hero_nebula")[:500]
                              sorted_eps = sorted(eps_map.keys())
                              first_link = eps_map.get(1, eps_map[sorted_eps[0]])
                              titles_ref.document(doc.id).update({
                                  "type": "series",
                                  "videoUrl": first_link[:500],
                                  "seasonCount": max(1, season_number),
                                  "isUpcoming": False,
                                  "updatedAt": firestore.SERVER_TIMESTAMP,
                              })
                              ep_count = publish_series_episodes(titles_ref, doc.id, t_name, season_number, poster, eps_map)
                              print(f"  [Backfill] Populated {ep_count} episodes for existing series '{t_name}' (S{season_number})!")
                              break
                  except Exception as e:
                      print(f"  [Backfill Warn] Could not backfill '{t_name}': {e}")

          def fetch_recent_posts(session, base_url: str, max_posts: int):
              posts = []
              api_url = f"{base_url}/wp-json/wp/v2/posts?per_page={max_posts}&_embed=1"
              try:
                  resp = session.get(api_url, timeout=15)
                  if resp.ok and "json" in resp.headers.get("Content-Type", "").lower():
                      for item in resp.json():
                          raw_title = item.get("title", {}).get("rendered", "")
                          post_link = item.get("link", "")
                          if not post_link:
                              continue
                          full_html = item.get("content", {}).get("rendered", "")
                          try:
                              pr = session.get(post_link, timeout=15)
                              if pr.ok:
                                  full_html = pr.text
                          except Exception as e:
                              print(f"  [Warn] Full page fetch fallback for {post_link}: {e}")

                          poster_url = extract_poster_from_html(full_html)
                          if not poster_url:
                              media_list = item.get("_embedded", {}).get("wp:featuredmedia", [])
                              if media_list and isinstance(media_list, list):
                                  poster_url = media_list[0].get("source_url", "")

                          excerpt_text = BeautifulSoup(item.get("excerpt", {}).get("rendered", ""), "lxml").get_text(" ", strip=True)
                          posts.append({
                              "raw_title": raw_title,
                              "url": post_link,
                              "html": full_html,
                              "poster": poster_url,
                              "synopsis": excerpt_text,
                          })
                      if posts:
                          return posts
              except Exception as e:
                  print(f"[Info] WP API fallback ({e})")

              resp = session.get(base_url, timeout=15)
              resp.raise_for_status()
              soup = BeautifulSoup(resp.text, "lxml")
              seen = set()
              for el in soup.select("article, .post, .movie-card, .entry-title a, h2 a, h3 a"):
                  a_tag = el if el.name == "a" else el.find("a", href=True)
                  if not a_tag or not a_tag.get("href"):
                      continue
                  u = urljoin(base_url, a_tag["href"].strip())
                  if u in seen or u.rstrip("/") == base_url.rstrip("/"):
                      continue
                  seen.add(u)
                  try:
                      pr = session.get(u, timeout=15)
                      if not pr.ok:
                          continue
                      ps = BeautifulSoup(pr.text, "lxml")
                      h1 = ps.find("h1")
                      raw_title = h1.get_text(" ", strip=True) if h1 else a_tag.get_text(" ", strip=True)
                      poster_url = extract_poster_from_html(pr.text)
                      og_desc = ps.find("meta", property="og:description")
                      synopsis = og_desc["content"] if og_desc and og_desc.get("content") else ""
                      posts.append({"raw_title": raw_title, "url": u, "html": pr.text, "poster": poster_url, "synopsis": synopsis})
                      if len(posts) >= max_posts:
                          break
                  except Exception:
                      pass
              return posts

          db = init_firestore_db()
          session = create_http_session()
          titles_ref = db.collection("titles")

          # Step 1: Backfill any existing web series in Firestore that currently has 0 or 1 episode
          backfill_existing_series_without_episodes(session, DEFAULT_SITE_URL, titles_ref)

          existing_keys = {}
          for doc in titles_ref.stream():
              d = doc.to_dict() or {}
              t_name = str(d.get("title", "")).strip()
              t_year = int(d.get("year", 2026) or 2026)
              if t_name:
                  existing_keys[normalize_key(t_name, t_year)] = doc.id

          print(f"Fetching latest {MAX_MOVIES_PER_RUN} posts from {DEFAULT_SITE_URL} ...")
          posts = fetch_recent_posts(session, DEFAULT_SITE_URL, MAX_MOVIES_PER_RUN)
          for post in posts:
              clean_title, year, language, content_type, season_number = clean_movie_title_and_year(post["raw_title"])
              norm_key = normalize_key(clean_title, year)
              doc_id = f"auto_{norm_key}"[:64]

              episodes_map = {}
              if content_type == "series":
                  episodes_map = extract_all_episodes(session, post["url"], post["html"])

              if content_type == "series" and episodes_map:
                  sorted_eps = sorted(episodes_map.keys())
                  stream_link = episodes_map.get(1, episodes_map[sorted_eps[0]])
              else:
                  stream_link = extract_multi_hop_links(session, post["url"], post["html"])

              if not stream_link and not episodes_map:
                  print(f"Skipping '{clean_title}' - no stream links found.")
                  continue

              poster = (post["poster"] or "drawable://img_hero_nebula")[:500]
              target_doc_id = existing_keys.get(norm_key, doc_id)

              if norm_key in existing_keys:
                  titles_ref.document(target_doc_id).update({
                      "type": content_type,
                      "videoUrl": stream_link[:500] if stream_link else "",
                      "seasonCount": max(1, season_number),
                      "isUpcoming": False,
                      "updatedAt": firestore.SERVER_TIMESTAMP,
                  })
                  if content_type == "series" and episodes_map:
                      ep_count = publish_series_episodes(titles_ref, target_doc_id, clean_title, season_number, poster, episodes_map)
                      print(f"Updated existing Series '{clean_title}' (S{season_number}) with {ep_count} episodes (No Duplicate).")
                  else:
                      print(f"Updated existing '{clean_title}' ({year}) -> {stream_link} (No Duplicate).")
                  continue

              titles_ref.document(doc_id).set({
                  "authorId": "github_automation",
                  "type": content_type,
                  "title": clean_title[:200],
                  "description": (post["synopsis"] or f"Watch and download {clean_title} ({year}) in {language}.")[:2000],
                  "poster": poster,
                  "backdrop": poster,
                  "genres": ["Action", "Drama"] if content_type == "movie" else ["Drama", "Series"],
                  "cast": ["Featured Cast"],
                  "director": "Original Release",
                  "language": language[:50],
                  "year": year,
                  "rating": 8.4,
                  "ageRating": "U/A 16+",
                  "duration": "2h 15m" if content_type == "movie" else f"Season {season_number}",
                  "trailerUrl": (stream_link or "")[:500],
                  "videoUrl": (stream_link or "")[:500],
                  "subtitles": ["English", "Hindi"],
                  "audioTracks": ["Hindi", "English"],
                  "isFeatured": True,
                  "isTrending": True,
                  "isNewRelease": True,
                  "isUpcoming": False,
                  "isPublished": True,
                  "viewsCount": 0,
                  "seasonCount": max(1, season_number),
                  "createdAt": firestore.SERVER_TIMESTAMP,
                  "updatedAt": firestore.SERVER_TIMESTAMP,
              }, merge=True)
              existing_keys[norm_key] = doc_id

              if content_type == "series":
                  if not episodes_map and stream_link:
                      episodes_map = {1: stream_link}
                  ep_count = publish_series_episodes(titles_ref, doc_id, clean_title, season_number, poster, episodes_map)
                  print(f"Published NEW Series '{clean_title}' (S{season_number}) with {ep_count} episodes! | Poster: {poster}")
              else:
                  print(f"Published NEW Movie '{clean_title}' ({year}) | Poster: {poster} | Link: {stream_link}")
          EOF
          fi
