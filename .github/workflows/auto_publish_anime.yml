name: CineNova Auto-Publish Anime Series & Movies

on:
  # Har 3 ghante me automatically chalega (100% Free on GitHub Actions)
  schedule:
    - cron: '0 */3 * * *'
  # GitHub Actions tab se 1-click manual run ke liye
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target Anime Website URL (Default: https://www.rareanimes.mov)'
        required: false
        default: 'https://www.rareanimes.mov'
      max_items:
        description: 'Kitne anime posts scrape karne hain (Default: 120)'
        required: false
        default: '120'

jobs:
  sync-anime-to-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper firebase-admin lxml

      - name: Scrape Anime Series (All Seasons/Episodes) & Auto-Publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_ID: "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841"
          ANIME_SITE_URL: ${{ github.event.inputs.site_url || 'https://www.rareanimes.mov' }}
          MAX_ANIME_PER_RUN: ${{ github.event.inputs.max_items || '120' }}
          FALLBACK_SITE_URL: "https://animedubhindi.link"
          ORIGIN_CLEANUP: "unpublish"
          LINK_RECHECK_BUDGET: "80"
          DIRECT_HOSTS: "hubcloud,pixeldrain"
          KEEP_WRAPPER_LINKS: "false"
          BLOCKED_LINK_HOSTS: "razorshell"
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u - << 'EOF'
          #!/usr/bin/env python3
          import html
          import json
          import os
          import re
          import sys
          import time
          import warnings
          from urllib.parse import quote_plus, urljoin

          warnings.filterwarnings("ignore")

          if hasattr(sys.stdout, "reconfigure"):
              sys.stdout.reconfigure(line_buffering=True)
          if hasattr(sys.stderr, "reconfigure"):
              sys.stderr.reconfigure(line_buffering=True)

          import firebase_admin
          from bs4 import BeautifulSoup
          from firebase_admin import credentials, firestore
          import requests

          DEFAULT_SITE_URL = os.environ.get("ANIME_SITE_URL", "https://www.rareanimes.mov").rstrip("/")
          FIREBASE_DATABASE_ID = os.environ.get(
              "FIREBASE_DATABASE_ID",
              "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841",
          )
          MAX_ANIME_PER_RUN = int(os.environ.get("MAX_ANIME_PER_RUN", 120))

          USER_AGENT = (
              "Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/126.0.0.0 Mobile Safari/537.36"
          )

          BLOCKED_KEYWORDS = [
              "power ranger", "power rangers", "dino fury", "cosmic fury", "beast morphers",
              "ninja steel", "dino charge", "megaforce", "super megaforce", "samurai ranger",
              "jungle fury", "mystic force", "s.p.d", "spd", "dino thunder", "ninja storm",
              "wild force", "time force", "lightspeed rescue", "lost galaxy", "in space",
              "turbo", "zeo", "mighty morphin", "kamen rider", "ryukendo", "ultraman", "super sentai",
              "dragon ball", "dragonball", "dragon ball z", "dragon ball super", "dragon ball gt",
              "dragon ball daima", "dragon ball kai", "dbz",
              "tom and jerry", "tom & jerry", "tom jerry", "ben 10", "ben10", "oggy",
              "courage the cowardly dog", "dexter's laboratory", "dexters laboratory",
              "adventure time", "johnny test", "horrid henry", "supa strikas", "teen titans",
              "powerpuff", "generator rex", "jackie chan adventures", "winx club", "dc super hero",
              "chhota bheem", "motu patlu", "bandbudh aur budbak", "roll no 21", "kid cosmic",
              "boonie bears", "dorothy and the wizard of oz", "looney tunes", "bugs bunny",
              "scooby doo", "scooby-doo", "spongebob", "sponge bob", "spider-man", "spiderman",
              "batman", "avengers", "iron man", "x-men", "transformers", "barbie",
              "teenage mutant ninja turtles", "tmnt", "miraculous ladybug", "slugterra"
          ]

          def is_title_blocked(text_or_url: str) -> bool:
              if not text_or_url:
                  return False
              norm = re.sub(r"[-_&.+:]+", " ", str(text_or_url).lower())
              norm = re.sub(r"\s+", " ", norm).strip()
              for kw in BLOCKED_KEYWORDS:
                  kw_norm = re.sub(r"[-_&.+:]+", " ", kw.lower()).strip()
                  if kw_norm and re.search(r"(?<![a-z0-9])" + re.escape(kw_norm) + r"(?![a-z0-9])", norm):
                      return True
              return False

          def log(msg: str):
              print(msg, flush=True)

          def create_http_session():
              try:
                  import cloudscraper
                  session = cloudscraper.create_scraper(
                      browser={"browser": "chrome", "platform": "android", "desktop": False}
                  )
              except Exception:
                  session = requests.Session()

              session.headers.update(
                  {
                      "User-Agent": USER_AGENT,
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Referer": f"{DEFAULT_SITE_URL}/",
                  }
              )
              return session

          def init_firestore_db():
              raw_service_account = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "").strip()
              if not raw_service_account:
                  log("ERROR: FIREBASE_SERVICE_ACCOUNT secret is empty! Add it in GitHub Settings -> Secrets.")
                  sys.exit(1)

              service_account_dict = json.loads(raw_service_account)
              log(f"Authenticated with Firebase Project: {service_account_dict.get('project_id')}")
              cred = credentials.Certificate(service_account_dict)
              if not firebase_admin._apps:
                  firebase_admin.initialize_app(cred)

              candidates = [
                  FIREBASE_DATABASE_ID,
                  "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841",
                  "(default)",
              ]
              seen = set()
              for db_id in candidates:
                  if not db_id or db_id in seen:
                      continue
                  seen.add(db_id)
                  try:
                      client = firestore.client(database_id=db_id)
                      list(client.collection("titles").limit(1).stream())
                      log(f"Successfully connected to Firestore Database ID: '{db_id}'")
                      return client
                  except Exception as e:
                      log(f"[Info] Database '{db_id}' not accessible ({e}), trying next...")

              return firestore.client(database_id=FIREBASE_DATABASE_ID)

          def sanitize_anime_title(raw_title: str):
              text = html.unescape(re.sub(r"<[^>]+>", "", raw_title or "")).strip()

              s_m = re.search(r"\b(?:Season|S)\s*0*(\d{1,2})\b", text, re.I)
              season_number = int(s_m.group(1)) if s_m else 1

              y_m = re.search(r"\b((?:19|20)\d{2})\b", text)
              year = int(y_m.group(1)) if y_m else 2026

              language = "Hindi Dubbed"
              if re.search(r"Dual\s*Audio|Multi\s*Audio| Tamil| Telugu", text, re.I):
                  language = "Multi Audio (Hindi)"
              elif re.search(r"Hindi\s*Sub", text, re.I):
                  language = "Japanese (Hindi Sub)"

              clean = re.sub(r"[\(\[]\s*(?:19|20)\d{2}\s*[\)\]]", "", text, flags=re.I)
              clean = re.sub(r"[\(\[]\s*(?:Season|S)\s*\d+.*", "", clean, flags=re.I)
              clean = re.sub(r"\b(?:Season|S)\s*\d+.*", "", clean, flags=re.I)
              clean = re.sub(r"[\(\[]\s*Part\s*\d+.*", "", clean, flags=re.I)
              clean = re.sub(r"\bPart\s*\d+.*", "", clean, flags=re.I)
              clean = re.sub(
                  r"\b(?:Hindi\s*Dubbed|Hindi\s*Subbed|Hindi|Tamil|Telugu|Dual\s*Audio|Multi\s*Audio|Episodes?\s*Download|Download\s*HD|All\s*Episodes|Watch\s*Download|Download\s*480p.*)\b.*",
                  "",
                  clean,
                  flags=re.I,
              )

              for opener, closer in [("(", ")"), ("[", "]"), ("{", "}")]:
                  if opener in clean and closer not in clean:
                      clean = clean.split(opener, 1)[0]

              clean = re.sub(r"[\(\[\{\)\]\}\-–—:|/\\,\.]+$", "", clean).strip()
              clean = re.sub(r"^[\(\[\{\)\]\}\-–—:|/\\,\.]+", "", clean).strip()
              clean = re.sub(r"\s{2,}", " ", clean)

              display_title = clean or text[:60].strip()
              return display_title, season_number, language, year

          def resolve_codedew_to_hubcloud(session, codedew_url: str, post_url: str = ""):
              if not codedew_url:
                  return None

              lower_url = codedew_url.lower()
              if any(k in lower_url for k in ["hubcloud", "razorshell.space", "pixeldrain.net", "gamerxyt"]):
                  return codedew_url

              try:
                  req_headers = {"Referer": post_url or f"{DEFAULT_SITE_URL}/"}
                  r1 = session.get(codedew_url, headers=req_headers, timeout=10)
                  if not r1.ok:
                      return codedew_url if "codedew.com" in lower_url else None

                  h1 = r1.text

                  # 1. Direct HubCloud in page
                  direct_hub = re.findall(r"href=[\"'](https?://[^/]*hubcloud[^\s\"']+)[\"']", h1, re.I)
                  if direct_hub:
                      return html.unescape(direct_hub[0])

                  # 2. Razorshell / MultiQuality embed or downlead ID
                  rz = re.search(
                      r"(?:multiquality/\?url=|ziptron\.php/\?|razorshell\.space/(?:embed|downlead)/)([A-Za-z0-9_-]+)",
                      h1,
                      re.I,
                  )
                  if rz:
                      return f"https://argon.razorshell.space/downlead/{rz.group(1)}/"

                  # 3. Follow step 1 redirect (ad_done=1 or data-href)
                  step1_links = re.findall(r"data-href=[\"']([^\"']+)[\"']", h1) or re.findall(
                      r"href=[\"']([^\"']*ad_done=1[^\"']*)[\"']", h1
                  )
                  if step1_links:
                      step2_url = urljoin(codedew_url, html.unescape(step1_links[0]))
                      r2 = session.get(step2_url, headers={"Referer": codedew_url}, timeout=10)
                      if r2.ok:
                          h2 = r2.text

                          direct_hub2 = re.findall(r"href=[\"'](https?://[^/]*hubcloud[^\s\"']+)[\"']", h2, re.I)
                          if direct_hub2:
                              return html.unescape(direct_hub2[0])

                          rz2 = re.search(
                              r"(?:multiquality/\?url=|ziptron\.php/\?|razorshell\.space/(?:embed|downlead)/)([A-Za-z0-9_-]+)",
                              h2,
                              re.I,
                          )
                          if rz2:
                              return f"https://argon.razorshell.space/downlead/{rz2.group(1)}/"

                          for candidate in re.findall(r"data-href=[\"']([^\"']+)[\"']", h2):
                              target = html.unescape(candidate)
                              if "hubcloud" in target.lower():
                                  return target
                              rz3 = re.search(
                                  r"(?:multiquality/\?url=|ziptron\.php/\?|razorshell\.space/(?:embed|downlead)/)([A-Za-z0-9_-]+)",
                                  target,
                                  re.I,
                              )
                              if rz3:
                                  return f"https://argon.razorshell.space/downlead/{rz3.group(1)}/"
                              pd3 = re.search(r"(?:pixeldrain\.com/u/|watchbeta/\?url=)([A-Za-z0-9_-]+)", target, re.I)
                              if pd3:
                                  return f"https://pixeldrain.net/api/file/{pd3.group(1)}"
              except Exception:
                  pass

              return codedew_url if "codedew.com" in lower_url else None

          def extract_raw_hubcloud_episode_map(post_html: str):
              episodes_raw = {}
              episodes_titles = {}

              blocks = re.split(r"(Episode\s*0*\d+[^<\n]*)", post_html, flags=re.I)
              current_ep = 1
              found_any_ep = False

              for block in blocks:
                  ep_m = re.match(r"^Episode\s*0*(\d+)(?:\s*[-–—:]\s*(.+))?", block.strip(), re.I)
                  if ep_m:
                      current_ep = int(ep_m.group(1))
                      raw_title = (ep_m.group(2) or "").strip()
                      clean_name = re.sub(r"<[^>]+>", "", raw_title).strip()
                      clean_name = re.sub(r"[\-–—\s]+$", "", clean_name).strip()
                      clean_name = re.sub(r"\b(?:new!?|hd|part\s*\d+\s*finale)\b", "", clean_name, flags=re.I).strip()
                      clean_name = re.sub(r"[\-–—\s]+$", "", clean_name).strip()
                      if clean_name and "untouched" not in clean_name.lower():
                          episodes_titles[current_ep] = clean_name
                      found_any_ep = True
                  else:
                      if not found_any_ep and len(blocks) > 1:
                          continue

                      ep_section = re.split(
                          r"<hr\b|<h[1-4]\b|<footer\b|<div\s+class=[\"']entry-comments",
                          block,
                          flags=re.I,
                      )[0]

                      a_tags = re.findall(
                          r'<a\s+[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',
                          ep_section,
                          re.I,
                      )
                      valid_links = []
                      for href, inner in a_tags:
                          inner_clean = re.sub(r"<[^>]+>", "", inner).strip().lower()
                          href_lower = href.lower()

                          if not any(d in href_lower for d in ["codedew.com", "hubcloud", "gamerxyt", "razorshell", "pixeldrain"]):
                              continue

                          if any(bad in inner_clean for bad in ["untouched", "zip", "telegram", "join", "channel"]) or "untouched" in href_lower or href_lower.endswith(".zip"):
                              continue

                          priority = 5
                          if "hubcloud" in inner_clean or "hubcloud" in href_lower:
                              priority = 1
                          elif "multquality" in inner_clean or "multiquality" in inner_clean:
                              priority = 2
                          elif "dlbeta" in inner_clean or "watchbeta" in inner_clean:
                              priority = 3
                          elif any(k in inner_clean for k in ["watch", "stream", "download", "fast"]):
                              priority = 4
                          elif "mega" in inner_clean:
                              priority = 9

                          valid_links.append((priority, href))

                      if valid_links:
                          valid_links.sort(key=lambda x: x[0])
                          episodes_raw.setdefault(current_ep, []).extend([u for _, u in valid_links])

              if not episodes_raw:
                  a_tags = re.findall(
                      r'<a\s+[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',
                      post_html,
                      re.I,
                  )
                  fallback_links = []
                  for href, inner in a_tags:
                      inner_clean = re.sub(r"<[^>]+>", "", inner).strip().lower()
                      href_lower = href.lower()
                      if not any(d in href_lower for d in ["codedew.com", "hubcloud", "gamerxyt", "razorshell", "pixeldrain"]):
                          continue
                      if any(bad in inner_clean for bad in ["untouched", "zip", "telegram"]) or "untouched" in href_lower or href_lower.endswith(".zip"):
                          continue
                      priority = 5
                      if "hubcloud" in inner_clean or "hubcloud" in href_lower:
                          priority = 1
                      elif "multquality" in inner_clean or "multiquality" in inner_clean:
                          priority = 2
                      elif "dlbeta" in inner_clean or "watchbeta" in inner_clean:
                          priority = 3
                      fallback_links.append((priority, href))

                  if fallback_links:
                      fallback_links.sort(key=lambda x: x[0])
                      episodes_raw[1] = [u for _, u in fallback_links]

              return episodes_raw, episodes_titles

          def resolve_anime_episodes(session, raw_ep_map: dict, existing_season_eps: dict, post_url: str):
              resolved_episodes = {}
              log(f"  => Found {len(raw_ep_map)} episodes on page.")

              for ep_num in sorted(raw_ep_map.keys()):
                  if ep_num in existing_season_eps and existing_season_eps[ep_num]:
                      resolved_episodes[ep_num] = existing_season_eps[ep_num]
                      log(f"    [Ep {ep_num:02d}] Already in database -> {existing_season_eps[ep_num][:45]}...")
                      continue

                  candidates = raw_ep_map[ep_num]
                  real_stream = None
                  seen_c = set()
                  for candidate_link in candidates:
                      if candidate_link in seen_c:
                          continue
                      seen_c.add(candidate_link)
                      real_stream = resolve_codedew_to_hubcloud(session, candidate_link, post_url)
                      if real_stream and any(
                          k in real_stream.lower()
                          for k in ["hubcloud", "razorshell.space", "pixeldrain", "gamerxyt", "codedew.com"]
                      ):
                          break

                  if real_stream:
                      resolved_episodes[ep_num] = real_stream
                      log(f"    [Ep {ep_num:02d}] Resolved Stream -> {real_stream[:60]}...")
                  else:
                      log(f"    [Ep {ep_num:02d}] Link pending on website, skipped.")

              return resolved_episodes

          def fetch_anime_post_details(session, post_url: str):
              try:
                  r = session.get(post_url, timeout=12)
                  if not r.ok:
                      return None
                  html_text = r.text
                  soup = BeautifulSoup(html_text, "lxml")

                  title_tag = soup.find("h1") or soup.find("title")
                  raw_title = title_tag.get_text(" ", strip=True) if title_tag else ""

                  og_img = soup.find("meta", property="og:image")
                  poster = og_img["content"].strip() if og_img and og_img.get("content") else ""

                  og_desc = soup.find("meta", property="og:description")
                  synopsis = og_desc["content"].strip() if og_desc and og_desc.get("content") else ""

                  return {
                      "url": post_url,
                      "html": html_text,
                      "raw_title": raw_title,
                      "poster": poster,
                      "synopsis": synopsis,
                  }
              except Exception as e:
                  log(f"  [Warn] Failed fetching post {post_url}: {e}")
                  return None

          def collect_target_anime_urls(session, base_url: str):
              anime_cat_url = f"{base_url}/category/animes"
              log(f"Scanning pure Anime category across {anime_cat_url}/ pages...")
              seen = set()
              collected = []

              pages_to_check = [f"{anime_cat_url}/"] + [f"{anime_cat_url}/page/{i}/" for i in range(2, 31)]
              for page_url in pages_to_check:
                  if len(collected) >= MAX_ANIME_PER_RUN:
                      break
                  try:
                      r = session.get(page_url, timeout=12)
                      if not r.ok:
                          continue

                      articles = re.findall(r"<article[\s\S]*?</article>", r.text, re.I)
                      for art in articles:
                          m = re.search(
                              r"href=[\"'](https?://(?:www\.)?rareanimes\.mov/[^\s\"'#?]+)[\"']",
                              art,
                              re.I,
                          )
                          if not m:
                              continue
                          clean_url = m.group(1).split("?")[0].rstrip("/") + "/"
                          if clean_url in seen or is_title_blocked(clean_url) or _is_junk_url(clean_url):
                              continue
                          if any(
                              k in clean_url
                              for k in (
                                  "all-anime-cartoon",
                                  "wp-content",
                                  "wp-json",
                                  "feed",
                                  "comments",
                                  "home",
                                  "category",
                                  "contact",
                                  "privacy",
                                  "dmca",
                                  "disclaimer",
                                  "about",
                              )
                          ):
                              continue
                          seen.add(clean_url)
                          collected.append(clean_url)
                          if len(collected) >= MAX_ANIME_PER_RUN:
                              break
                  except Exception as e:
                      log(f"  [Warn] Error checking page {page_url}: {e}")

              log(f"Total pure anime posts collected automatically: {len(collected)}")
              return collected, seen

          def discover_all_seasons_for_series(session, base_url: str, clean_title: str, post_html: str, seen_urls: set):
              if is_title_blocked(clean_title):
                  return []

              discovered = []
              clean_slug = re.sub(r"[^a-z0-9]+", "-", clean_title.lower()).strip("-")

              if post_html:
                  direct_links = re.findall(
                      r"href=[\"'](https?://(?:www\.)?rareanimes\.mov/[^\s\"'#?]+)[\"']",
                      post_html,
                      re.I,
                  )
                  for dl in direct_links:
                      clean_u = dl.split("?")[0].rstrip("/") + "/"
                      if clean_u in seen_urls or is_title_blocked(clean_u) or _is_junk_url(clean_u):
                          continue
                      if clean_slug in clean_u.lower() and re.search(r"season[-_]?0*\d+", clean_u, re.I):
                          seen_urls.add(clean_u)
                          discovered.append(clean_u)

              query = quote_plus(clean_title)
              for p in range(1, 4):
                  search_url = f"{base_url}/?s={query}" if p == 1 else f"{base_url}/page/{p}/?s={query}"
                  try:
                      r = session.get(search_url, timeout=10)
                      if not r.ok:
                          continue
                      articles = re.findall(r"<article[\s\S]*?</article>", r.text, re.I)
                      for art in articles:
                          m = re.search(
                              r"href=[\"'](https?://(?:www\.)?rareanimes\.mov/[^\s\"'#?]+)[\"']",
                              art,
                              re.I,
                          )
                          if not m:
                              continue
                          clean_url = m.group(1).split("?")[0].rstrip("/") + "/"
                          if clean_url in seen_urls or is_title_blocked(clean_url) or _is_junk_url(clean_url):
                              continue
                          if clean_slug and clean_slug in clean_url.lower():
                              seen_urls.add(clean_url)
                              discovered.append(clean_url)
                  except Exception:
                      break

              return discovered

          def load_fast_existing_anime(titles_ref):
              log("Checking existing anime database...")
              existing_anime = {}
              try:
                  for doc in titles_ref.stream():
                      d = doc.to_dict() or {}
                      t_name = d.get("title", "")
                      if is_title_blocked(t_name) or is_title_blocked(doc.id):
                          log(f"  [Auto-Cleanup] Deleting non-anime from CineNova: '{t_name}' ({doc.id})")
                          try:
                              for ep_doc in titles_ref.document(doc.id).collection("episodes").stream():
                                  ep_doc.reference.delete()
                              doc.reference.delete()
                              log(f"  [Auto-Cleanup] Successfully removed '{t_name}'.")
                          except Exception as ce:
                              log(f"  [Warn] Failed deleting blocked document: {ce}")
                          continue

                      g = d.get("genres", [])
                      if not ("Anime" in g or "Animation" in g or doc.id.startswith("anime_")):
                          continue

                      existing_anime[doc.id] = {
                          "id": doc.id,
                          "title": t_name,
                          "seasonCount": int(d.get("seasonCount", 1) or 1),
                          "videoUrl": str(d.get("videoUrl", "")),
                          "authorId": d.get("authorId"),
                          "originCountry": d.get("originCountry"),
                          "isPublished": d.get("isPublished", True),
                          "hiddenByOriginCheck": d.get("hiddenByOriginCheck", False),
                      }
                  log(f"Database ready: {len(existing_anime)} anime series found.")
              except Exception as e:
                  log(f"[Warn] Error checking anime in Firestore: {e}")

              return existing_anime

          from bs4 import NavigableString

          FALLBACK_SITE_URL = os.environ.get("FALLBACK_SITE_URL", "https://animedubhindi.link").rstrip("/")
          FB_HUB_KEYS = ("hubcloud", "razorshell", "pixeldrain", "gamerxyt")
          FB_DEAD_MARKERS = (
              "file not found", "file has been removed", "file removed", "has been deleted",
              "link expired", "invalid link", "no longer available", "file does not exist",
          )

          def is_link_alive(session, url: str, referer: str = ""):
              # Sirf pakka dead (404/410 ya "file deleted" page) hone par False; shaque me True.
              try:
                  r = session.get(url, timeout=12, stream=True, allow_redirects=True,
                                  headers={"Referer": referer or f"{DEFAULT_SITE_URL}/"})
              except Exception:
                  return False
              try:
                  if r.status_code in (404, 410):
                      return False
                  if "text/html" in r.headers.get("Content-Type", "").lower():
                      body = next(r.iter_content(60000), b"").decode("utf-8", "ignore").lower()
                      if any(m in body for m in FB_DEAD_MARKERS):
                          return False
                  return True
              finally:
                  r.close()

          def _norm_title(t: str) -> str:
              return re.sub(r"[^a-z0-9]+", " ", (t or "").lower()).strip()

          def fallback_find_post(session, clean_title: str, season_number: int):
              want = _norm_title(clean_title)
              try:
                  r = session.get(
                      f"{FALLBACK_SITE_URL}/?s={quote_plus(clean_title)}",
                      timeout=12, headers={"Referer": FALLBACK_SITE_URL + "/"},
                  )
                  if not r.ok:
                      return None
                  soup = BeautifulSoup(r.text, "lxml")
                  partial = None
                  for a in soup.select("article .entry-title a, article h2 a, article h3 a"):
                      href = (a.get("href") or "").strip()
                      title = a.get_text(" ", strip=True)
                      if not href or is_title_blocked(title):
                          continue
                      c_title, c_season, _, _ = sanitize_anime_title(title)
                      if c_season != season_number:
                          continue
                      n = _norm_title(c_title)
                      if n == want:
                          return href
                      if partial is None and len(n) >= 4 and (want in n or n in want):
                          partial = href
                  return partial
              except Exception as e:
                  log(f"  [Fallback][Warn] Search failed: {e}")
                  return None

          def fallback_find_episode_page(post_html: str):
              soup = BeautifulSoup(post_html, "lxml")
              anchors = soup.find_all("a", href=True)
              for a in anchors:
                  if "adhlinks" in a["href"].lower():
                      return a["href"].strip()
              for a in anchors:
                  label = a.get_text(" ", strip=True).lower()
                  if "download" in label and "watch" in label:
                      return a["href"].strip()
              return None

          def _fb_quality_rank(label: str) -> int:
              l = label.lower()
              base = 0 if "720" in l else 1 if "480" in l else 2 if "1080" in l else 3
              return base + (10 if ("x265" in l or "hevc" in l or "10bit" in l) else 0)

          def parse_adhlinks_episodes(page_html: str):
              # return: {ep_number: [(rank, kind_priority, href), ...]}
              soup = BeautifulSoup(page_html, "lxml")
              root = soup.body or soup
              ep_re = re.compile(r"Episode\s*:?\s*0*(\d{1,4})", re.I)
              q_re = re.compile(r"\b(?:480|720|1080|2160)\s*p\b", re.I)
              eps = {}
              cur_ep, cur_label = None, ""
              for node in root.descendants:
                  if isinstance(node, NavigableString):
                      if node.find_parent("a"):
                          continue
                      t = str(node).strip()
                      if not t:
                          continue
                      m = ep_re.search(t)
                      if m and len(t) < 40:
                          cur_ep, cur_label = int(m.group(1)), ""
                      elif q_re.search(t):
                          cur_label = t
                      elif "watch online" in t.lower():
                          cur_label = "watch"
                  elif getattr(node, "name", None) == "a" and node.get("href") and cur_ep is not None:
                      label = node.get_text(" ", strip=True).lower()
                      href = node["href"].strip()
                      if cur_label == "watch":
                          continue  # "Click Here" streaming page abhi skip
                      if "hcloud" in label or "hubcloud" in label:
                          kind = 0
                      elif "multi" in label:
                          kind = 1
                      else:
                          continue  # GDF / MEGA / Fprs skip
                      eps.setdefault(cur_ep, []).append((_fb_quality_rank(cur_label), kind, href))
              return eps

          import base64
          from urllib.parse import urlparse, unquote

          DIRECT_HOSTS = tuple(h.strip().lower() for h in os.environ.get("DIRECT_HOSTS", "hubcloud,pixeldrain").split(",") if h.strip())

          def is_direct_host(url: str) -> bool:
              try:
                  host = urlparse((url or "").strip()).netloc.lower()
              except Exception:
                  return False
              return bool(host) and any(h in host for h in DIRECT_HOSTS)

          BLOCKED_LINK_HOSTS = tuple(h.strip().lower() for h in os.environ.get("BLOCKED_LINK_HOSTS", "razorshell").split(",") if h.strip())

          def is_blocked_host(url: str) -> bool:
              try:
                  host = urlparse((url or "").strip()).netloc.lower()
              except Exception:
                  return False
              return bool(host) and any(h in host for h in BLOCKED_LINK_HOSTS)

          def link_status(session, url: str, referer: str = "") -> str:
              # "ok" = direct (hubcloud/pixeldrain) aur chal raha hai | "blocked" = razorshell jaisa host (kabhi add nahi)
              # | "not_direct" = wrapper/unsupported | "dead"
              if is_blocked_host(url):
                  return "blocked"
              if not is_direct_host(url):
                  return "not_direct"
              return "ok" if is_link_alive(session, url, referer) else "dead"

          def _b64_candidates(text: str):
              toks = re.findall(r"atob\(\s*['\"]([A-Za-z0-9+/=_\-]{12,})['\"]\s*\)", text)
              toks += [unquote(t) for t in re.findall(
                  r"[?&](?:url|link|u|id|r|redirect|goto|data|d)=([A-Za-z0-9+/=_\-%]{16,})", text)]
              out = []
              for tok in toks:
                  try:
                      tok = tok.replace("-", "+").replace("_", "/")
                      dec = base64.b64decode(tok + "=" * (-len(tok) % 4)).decode("utf-8", "ignore").strip()
                      if dec.startswith("http"):
                          out.append(dec)
                  except Exception:
                      pass
              return out

          def _find_direct_urls(text: str):
              blob = html.unescape(text or "").replace("\\/", "/")
              found = [u.rstrip(".,;") for u in re.findall(r"https?://[^\s\"'<>\\)]+", blob) if is_direct_host(u)]
              found += [d for d in _b64_candidates(blob) if is_direct_host(d)]
              return found

          def _next_hops(text: str, base_url: str):
              blob = html.unescape(text or "").replace("\\/", "/")
              hops = re.findall(r"http-equiv=[\"']refresh[\"'][^>]*content=[\"'][^\"']*url=([^\"'>\s]+)", blob, re.I)
              hops += re.findall(r"(?:location(?:\.href)?\s*=|location\.replace\(|window\.open\()\s*['\"]([^'\"]+)['\"]", blob)
              try:
                  soup = BeautifulSoup(text or "", "lxml")
                  for a in soup.find_all("a", href=True):
                      label = a.get_text(" ", strip=True).lower()
                      if any(k in label for k in ("continue", "get link", "go to", "download", "hubcloud", "hcloud", "proceed", "unlock", "click here")):
                          hops.append(a["href"].strip())
              except Exception:
                  pass
              out, seen = [], set()
              for h in hops:
                  full = urljoin(base_url, h)
                  if full.startswith("http") and full not in seen and full != base_url:
                      seen.add(full)
                      out.append(full)
              return out

          def extract_direct_link(session, url: str, referer: str = "", depth: int = 0, seen=None):
              # Wrapper/redirect page se hubcloud/pixeldrain ka direct link nikalta hai (max 3 hop)
              seen = seen if seen is not None else set()
              if not url or url in seen or depth > 3 or is_blocked_host(url):
                  return None
              seen.add(url)
              if is_direct_host(url):
                  return url
              try:
                  r = session.get(url, timeout=12, allow_redirects=True, headers={"Referer": referer or url})
              except Exception:
                  return None
              for h in [r.url] + [x.url for x in getattr(r, "history", [])]:
                  if is_direct_host(h):
                      return h
              found = _find_direct_urls(r.text)
              if found:
                  return found[0]
              for nxt in _next_hops(r.text, r.url)[:3]:
                  got = extract_direct_link(session, nxt, r.url, depth + 1, seen)
                  if got:
                      return got
              if depth == 0:
                  log(f"    [Link][Debug] No hubcloud/pixeldrain link found via {urlparse(url).netloc} (final {r.url[:70]}, {len(r.text)} bytes)")
              return None

          def resolve_fallback_link(session, href: str, referer: str):
              if is_blocked_host(href):
                  return None
              if is_direct_host(href):
                  return href
              got = resolve_codedew_to_hubcloud(session, href, referer)
              if got and is_direct_host(got):
                  return got
              return extract_direct_link(session, href, referer)

          def fetch_from_animedubhindi(session, clean_title: str, season_number: int, wanted=None, skip=None):
              skip = skip or set()
              result = {}
              post_url = fallback_find_post(session, clean_title, season_number)
              if not post_url:
                  log(f"  [Fallback] '{clean_title}' S{season_number} not found on {FALLBACK_SITE_URL}")
                  return result
              log(f"  [Fallback] Matched post: {post_url}")
              try:
                  r1 = session.get(post_url, timeout=12, headers={"Referer": FALLBACK_SITE_URL + "/"})
                  hub_url = fallback_find_episode_page(r1.text) if r1.ok else None
                  if not hub_url:
                      log("  [Fallback] Download/Watch button link not found on post.")
                      return result
                  r2 = session.get(urljoin(post_url, hub_url), timeout=15, headers={"Referer": post_url})
                  if not r2.ok:
                      log(f"  [Fallback] Episode page HTTP {r2.status_code}")
                      return result
                  eps = parse_adhlinks_episodes(r2.text)
                  log(f"  [Fallback] Episode page parsed: {len(eps)} episodes (html {len(r2.text)} bytes)")
              except Exception as e:
                  log(f"  [Fallback][Warn] {e}")
                  return result

              for ep in sorted(eps):
                  if ep in skip or (wanted is not None and ep not in wanted):
                      continue
                  cands = [h for _, _, h in sorted(eps[ep], key=lambda x: (x[0], x[1]))][:6]
                  for href in cands:
                      url = resolve_fallback_link(session, urljoin(r2.url, href), r2.url)
                      if url and link_status(session, url, r2.url) == "ok":
                          result[ep] = url
                          log(f"    [Ep {ep:02d}] Fallback stream -> {url[:60]}...")
                          break
                  else:
                      log(f"    [Ep {ep:02d}] Fallback: no working link.")
              return result

          import datetime
          import difflib

          START_TS = time.time()
          SOFT_DEADLINE_SEC = 26 * 60
          RECHECK_DEADLINE_SEC = 18 * 60
          RECHECK_STATE = {"left": int(os.environ.get("LINK_RECHECK_BUDGET", 80))}

          ANILIST_URL = "https://graphql.anilist.co"
          ASIAN_ORIGINS = {"JP", "KR", "CN", "TW"}
          # Jo title galti se block ho jaye use yahan lowercase me daalo, e.g. {"some anime title"}
          ORIGIN_ALLOWLIST = set()
          _ORIGIN_CACHE = {}

          def _is_junk_url(u: str) -> bool:
              return bool(re.search(
                  r"/(?:feed|comments?)(?:/|$)|/comment-page-\d+|/page/\d+|/category/|/tag/|[?&]replytocom=",
                  u or "", re.I))

          def _origin_from_media(query_title, media_list):
              want = _norm_title(query_title)
              best, best_score = None, 0.0
              for m in media_list or []:
                  t = m.get("title") or {}
                  names = [t.get("romaji"), t.get("english"), t.get("native")] + list(m.get("synonyms") or [])
                  for n in names:
                      nn = _norm_title(n or "")
                      if not nn or not want:
                          continue
                      s = difflib.SequenceMatcher(None, want, nn).ratio()
                      shorter, longer = min(len(want), len(nn)), max(len(want), len(nn))
                      if shorter >= 6 and shorter / longer >= 0.6 and (want in nn or nn in want):
                          s = max(s, 0.9)
                      if s > best_score:
                          best, best_score = m, s
              if best is None or best_score < 0.85:
                  return "unknown", None
              cc = (best.get("countryOfOrigin") or "").upper()
              return ("asian" if cc in ASIAN_ORIGINS else "non_asian"), (cc or None)

          def anilist_origin(title: str):
              # returns (verdict, country): verdict = asian | non_asian | unknown | error
              if (title or "").strip().lower() in ORIGIN_ALLOWLIST:
                  return "asian", "JP"
              key = _norm_title(title)
              if not key:
                  return "unknown", None
              if key in _ORIGIN_CACHE:
                  return _ORIGIN_CACHE[key]
              q = re.sub(r"\ball\s+seasons?\b.*", "", title or "", flags=re.I).strip() or title
              query = ("query($s:String){Page(perPage:6){media(search:$s,type:ANIME)"
                       "{countryOfOrigin title{romaji english native} synonyms}}}")
              for _attempt in range(3):
                  try:
                      time.sleep(1.1)
                      r = requests.post(
                          ANILIST_URL,
                          json={"query": query, "variables": {"s": q}},
                          headers={"Content-Type": "application/json", "Accept": "application/json"},
                          timeout=15,
                      )
                  except Exception as e:
                      log(f"  [Origin][Warn] AniList request failed: {e}")
                      continue
                  if r.status_code == 429:
                      try:
                          wait = min(int(r.headers.get("Retry-After", "30")), 65)
                      except Exception:
                          wait = 30
                      log(f"  [Origin] AniList rate limit, waiting {wait}s")
                      time.sleep(wait)
                      continue
                  if not r.ok:
                      log(f"  [Origin][Warn] AniList HTTP {r.status_code}")
                      return "error", None
                  try:
                      media = ((r.json().get("data") or {}).get("Page") or {}).get("media") or []
                  except Exception:
                      return "error", None
                  res = _origin_from_media(q, media)
                  _ORIGIN_CACHE[key] = res
                  return res
              return "error", None

          def link_recheck_due(ep_d: dict, days: int = 7, key: str = "linkCheckedAt") -> bool:
              t = (ep_d or {}).get(key)
              if not t:
                  return True
              try:
                  age = datetime.datetime.now(datetime.timezone.utc) - t
                  return age.total_seconds() >= days * 86400
              except Exception:
                  return True

          def cleanup_non_anime(titles_ref, existing_anime):
              mode = os.environ.get("ORIGIN_CLEANUP", "unpublish").strip().lower()
              if mode not in ("unpublish", "delete"):
                  log("[Origin-Cleanup] OFF (ORIGIN_CLEANUP not set to unpublish/delete)")
                  return
              budget = int(os.environ.get("ORIGIN_CHECK_BUDGET", 120))
              hidden = restored = checked = 0
              log(f"[Origin-Cleanup] Checking automation-added titles (mode={mode}, budget={budget})...")
              for doc_id, info in list(existing_anime.items()):
                  if info.get("authorId") != "github_automation":
                      continue  # manual / baaki titles ko kabhi nahi chhedna
                  title = info.get("title", "")
                  cc = info.get("originCountry")
                  if title.strip().lower() in ORIGIN_ALLOWLIST:
                      cc = "JP"
                  if not cc:
                      if budget <= 0:
                          continue
                      budget -= 1
                      checked += 1
                      verdict, found_cc = anilist_origin(title)
                      if verdict == "error":
                          continue
                      cc = found_cc if found_cc else "UNKNOWN"
                      try:
                          titles_ref.document(doc_id).update({"originCountry": cc})
                      except Exception:
                          pass
                      info["originCountry"] = cc
                  if cc in ASIAN_ORIGINS:
                      if info.get("hiddenByOriginCheck") and info.get("isPublished") is False:
                          try:
                              titles_ref.document(doc_id).update({"isPublished": True, "hiddenByOriginCheck": False})
                              info["isPublished"] = True
                              restored += 1
                              log(f"  [Origin-Cleanup] Restored '{title}' ({cc})")
                          except Exception:
                              pass
                      continue
                  # non-Asian ya confirm nahi hua
                  if mode == "delete":
                      try:
                          for ep_doc in titles_ref.document(doc_id).collection("episodes").stream():
                              ep_doc.reference.delete()
                          titles_ref.document(doc_id).delete()
                          existing_anime.pop(doc_id, None)
                          hidden += 1
                          log(f"  [Origin-Cleanup] Deleted non-anime '{title}' ({cc})")
                      except Exception as e:
                          log(f"  [Warn] Delete failed for '{title}': {e}")
                  elif info.get("isPublished", True) is not False:
                      try:
                          titles_ref.document(doc_id).update({"isPublished": False, "hiddenByOriginCheck": True})
                          info["isPublished"] = False
                          hidden += 1
                          log(f"  [Origin-Cleanup] Hidden '{title}' (origin: {cc})")
                      except Exception as e:
                          log(f"  [Warn] Hide failed for '{title}': {e}")
              log(f"[Origin-Cleanup] Done. checked={checked}, hidden/deleted={hidden}, restored={restored}")

          def main():
              log("=" * 65)
              log("CineNova Automated Anime Scraper & Auto-Publisher")
              log("=" * 65)

              db = init_firestore_db()
              session = create_http_session()
              titles_ref = db.collection("titles")

              existing_anime = load_fast_existing_anime(titles_ref)
              cleanup_non_anime(titles_ref, existing_anime)
              target_urls, seen_urls = collect_target_anime_urls(session, DEFAULT_SITE_URL)
              log(f"Target anime series to process: {len(target_urls)}")

              published_count = 0
              searched_series_titles = set()
              idx = 0

              while idx < len(target_urls):
                  post_url = target_urls[idx]
                  idx += 1
                  if time.time() - START_TS > SOFT_DEADLINE_SEC:
                      log("[Time] Soft deadline reached - stopping this run cleanly (baaki agle run me).")
                      break
                  if _is_junk_url(post_url):
                      log(f"\n[{idx}/{len(target_urls)}] [Junk URL] Skipping {post_url}")
                      continue
                  if is_title_blocked(post_url):
                      log(f"\n[{idx}/{len(target_urls)}] [Blocked URL] Skipping {post_url}")
                      continue

                  log(f"\n[{idx}/{len(target_urls)}] Processing: {post_url}")
                  details = fetch_anime_post_details(session, post_url)
                  if not details or not details["raw_title"]:
                      continue

                  clean_title, season_number, language, year = sanitize_anime_title(details["raw_title"])
                  if is_title_blocked(clean_title) or is_title_blocked(details["raw_title"]):
                      log(f"  [Filter Blocked] Skipping '{clean_title}' (Non-anime / Blocked title)")
                      continue
                  slug = re.sub(r"[^a-z0-9]+", "_", clean_title.lower()).strip("_")
                  doc_id = f"anime_{slug}"[:60]

                  stored_origin = existing_anime.get(doc_id, {}).get("originCountry")
                  if stored_origin in ASIAN_ORIGINS:
                      origin_cc = stored_origin
                  elif stored_origin and clean_title.strip().lower() not in ORIGIN_ALLOWLIST:
                      log(f"  [Origin] '{clean_title}' was judged non-anime earlier ({stored_origin}) - skipping.")
                      continue
                  else:
                      verdict, origin_cc = anilist_origin(clean_title)
                      if verdict != "asian":
                          log(f"  [Origin] '{clean_title}' not confirmed as Japanese/Korean/Chinese anime ({verdict}, {origin_cc}) - skipping.")
                          continue

                  raw_ep_map, raw_ep_titles = extract_raw_hubcloud_episode_map(details["html"])
                  if not raw_ep_map:
                      log(f"  [Info] No stream links on primary page for '{clean_title}' - trying fallback site.")

                  if clean_title.lower() not in searched_series_titles:
                      searched_series_titles.add(clean_title.lower())
                      related_urls = discover_all_seasons_for_series(session, DEFAULT_SITE_URL, clean_title, details["html"], seen_urls)
                      if related_urls:
                          log(f"  [Multi-Season Discovery] Found {len(related_urls)} companion season posts for '{clean_title}'!")
                          target_urls.extend(related_urls)

                  existing_season_eps = {}
                  existing_ep_refs = {}
                  dead_eps = set()
                  frozen_dead = set()
                  upgrade_eps = set()
                  wrapper_urls = {}
                  try:
                      for ep_doc in titles_ref.document(doc_id).collection("episodes").where("seasonNumber", "==", season_number).stream():
                          ep_d = ep_doc.to_dict() or {}
                          e_num = int(ep_d.get("episodeNumber", 1) or 1)
                          s_url = str(ep_d.get("streamUrl") or ep_d.get("videoUrl") or "").strip()
                          existing_ep_refs[e_num] = (ep_doc.reference, ep_d)
                          if ep_d.get("linkStatus") == "dead":
                              if link_recheck_due(ep_d, days=2):
                                  dead_eps.add(e_num)
                              else:
                                  frozen_dead.add(e_num)
                              continue
                          if s_url:
                              if is_blocked_host(s_url):
                                  log(f"    [Ep {e_num:02d}] Saved link is blocked host ({urlparse(s_url).netloc}) -> dusri site se replace hoga.")
                                  dead_eps.add(e_num)
                                  continue
                              if (not is_direct_host(s_url)) and link_recheck_due(ep_d, days=2, key="upgradeTriedAt"):
                                  upgrade_eps.add(e_num)   # direct (hubcloud/pixeldrain) nahi hai -> badalne ki koshish
                              else:
                                  existing_season_eps[e_num] = s_url
                  except Exception:
                      pass

                  # Purane saved links ka dead-check (har run me limited budget, 7 din me ek baar)
                  for e_num in sorted(existing_season_eps.keys()):
                      ref, ep_d = existing_ep_refs[e_num]
                      if not link_recheck_due(ep_d):
                          continue
                      if RECHECK_STATE["left"] <= 0 or time.time() - START_TS > RECHECK_DEADLINE_SEC:
                          break
                      RECHECK_STATE["left"] -= 1
                      if is_link_alive(session, existing_season_eps[e_num], post_url):
                          try:
                              ref.update({"linkStatus": "ok", "linkCheckedAt": firestore.SERVER_TIMESTAMP})
                          except Exception:
                              pass
                      else:
                          log(f"    [Ep {e_num:02d}] Saved link is DEAD -> re-resolving.")
                          dead_eps.add(e_num)
                  for e_num in dead_eps:
                      existing_season_eps.pop(e_num, None)
                  for e_num in frozen_dead:
                      raw_ep_map.pop(e_num, None)
                  if frozen_dead and not raw_ep_map and not dead_eps and not existing_season_eps:
                      log(f"  [Dead] '{clean_title}' S{season_number}: sab links dead, thodi der baad dobara try hoga.")
                      continue

                  known_eps = set(existing_season_eps.keys()) | frozen_dead
                  gap_eps = (set(range(1, max(known_eps) + 1)) - known_eps) if known_eps else set()
                  if gap_eps:
                      log(f"  [Gap] '{clean_title}' S{season_number} missing episodes in DB: {sorted(gap_eps)}")
                  if raw_ep_map and existing_season_eps and not gap_eps and all(ep in existing_season_eps for ep in raw_ep_map.keys()):
                      log(
                          f"  [Already Added] Anime '{clean_title}' Season {season_number} has all {len(raw_ep_map)} episodes in CineNova. Skipping!"
                      )
                      continue

                  episodes_map = (
                      resolve_anime_episodes(session, raw_ep_map, existing_season_eps, post_url)
                      if raw_ep_map else {}
                  )

                  # Primary site ke naye resolve hue links verify karo
                  for _ep in list(episodes_map.keys()):
                      if _ep in existing_season_eps:
                          continue
                      _st = link_status(session, episodes_map[_ep], post_url)
                      if _st == "not_direct":
                          _deep = extract_direct_link(session, episodes_map[_ep], post_url)
                          if _deep and link_status(session, _deep, post_url) == "ok":
                              log(f"    [Ep {_ep:02d}] Wrapper link -> direct link extracted.")
                              episodes_map[_ep] = _deep
                              continue
                      if _st != "ok":
                          log(f"    [Ep {_ep:02d}] Primary link {_st} -> fallback site try hoga.")
                          if _st == "not_direct":
                              wrapper_urls[_ep] = episodes_map[_ep]
                          episodes_map.pop(_ep)

                  expected_eps = set(raw_ep_map.keys())
                  missing_eps = (expected_eps - set(episodes_map.keys())) if expected_eps else None
                  if missing_eps is not None:
                      missing_eps |= (gap_eps - set(episodes_map.keys()))

                  if missing_eps is None or missing_eps:
                      fb_eps = fetch_from_animedubhindi(
                          session, clean_title, season_number,
                          wanted=missing_eps,
                          skip=set(existing_season_eps.keys()) | set(episodes_map.keys()),
                      )
                      for _ep, _url in fb_eps.items():
                          episodes_map[_ep] = _url
                      if fb_eps:
                          log(f"  [Fallback] Added {len(fb_eps)} episodes from AnimeDubHindi.")

                  if os.environ.get("KEEP_WRAPPER_LINKS", "false").strip().lower() == "true":
                      for _ep, _u in wrapper_urls.items():
                          episodes_map.setdefault(_ep, _u)
                  for _ep in sorted(upgrade_eps - set(episodes_map.keys())):
                      _ref = existing_ep_refs.get(_ep)
                      if _ref:
                          try:
                              _ref[0].update({"upgradeTriedAt": firestore.SERVER_TIMESTAMP})
                              log(f"    [Ep {_ep:02d}] Direct link kahin nahi mila - purana link rakha (2 din baad dobara try).")
                          except Exception:
                              pass
                  for _ep in sorted(dead_eps - set(episodes_map.keys())):
                      _ref = existing_ep_refs.get(_ep)
                      if _ref:
                          try:
                              _ref[0].update({"isPublished": False, "linkStatus": "dead", "linkCheckedAt": firestore.SERVER_TIMESTAMP})
                              log(f"    [Ep {_ep:02d}] No working link anywhere -> episode hidden (isPublished=False).")
                          except Exception as _e:
                              log(f"  [Warn] Could not mark dead episode: {_e}")

                  if not episodes_map:
                      log(f"  [Skip] Could not resolve any episodes for '{clean_title}'.")
                      continue

                  poster = details["poster"] or "drawable://img_hero_nebula"
                  sorted_eps = sorted(episodes_map.keys())
                  first_stream = episodes_map[sorted_eps[0]]
                  current_seasons = existing_anime.get(doc_id, {}).get("seasonCount", 1)

                  genres = ["Anime", "Animation", "Action", "Fantasy", "Adventure"]
                  titles_ref.document(doc_id).set(
                      {
                          "authorId": "github_automation",
                          "originCountry": origin_cc,
                          "type": "series",
                          "title": clean_title[:200],
                          "description": (
                              details["synopsis"]
                              or f"Watch and download {clean_title} Season {season_number} in {language} with full offline support."
                          )[:2000],
                          "poster": poster[:500],
                          "backdrop": poster[:500],
                          "genres": genres,
                          "cast": ["Original Japanese & Hindi Voice Cast"],
                          "director": "Anime Studio Release",
                          "language": language[:50],
                          "year": year,
                          "rating": 8.8,
                          "ageRating": "U/A 13+",
                          "duration": f"Season {season_number}",
                          "trailerUrl": first_stream[:500],
                          "videoUrl": first_stream[:500],
                          "subtitles": ["English", "Hindi"],
                          "audioTracks": ["Hindi", "Japanese"],
                          "isFeatured": (published_count < 4),
                          "isTrending": (published_count < 12),
                          "isNewRelease": True,
                          "isUpcoming": False,
                          "isPublished": True,
                          "viewsCount": 0,
                          "seasonCount": max(current_seasons, season_number),
                          "createdAt": firestore.SERVER_TIMESTAMP,
                          "updatedAt": firestore.SERVER_TIMESTAMP,
                      },
                      merge=True,
                  )

                  episodes_col = titles_ref.document(doc_id).collection("episodes")
                  valid_ep_ids = set()

                  for ep_num, stream_url in episodes_map.items():
                      ep_doc_id = f"s{season_number}_ep{ep_num}"
                      valid_ep_ids.add(ep_doc_id)
                      ep_title = raw_ep_titles.get(ep_num) or f"Episode {ep_num}"
                      episodes_col.document(ep_doc_id).set(
                          {
                              "titleId": doc_id,
                              "seasonNumber": season_number,
                              "episodeNumber": ep_num,
                              "title": ep_title[:200],
                              "description": f"{clean_title} - Season {season_number}, Episode {ep_num}: {ep_title}"[:500],
                              "thumbnail": poster[:500],
                              "duration": "24m",
                              "videoUrl": stream_url[:500],
                              "streamUrl": stream_url[:500],
                              **({"linkStatus": "ok", "linkCheckedAt": firestore.SERVER_TIMESTAMP} if ep_num not in existing_season_eps else {}),
                              "isPublished": True,
                              "createdAt": firestore.SERVER_TIMESTAMP,
                              "updatedAt": firestore.SERVER_TIMESTAMP,
                          },
                          merge=True,
                      )

                  published_count += 1
                  existing_anime.setdefault(
                      doc_id,
                      {
                          "id": doc_id,
                          "title": clean_title,
                          "seasonCount": max(current_seasons, season_number),
                          "videoUrl": first_stream,
                          "originCountry": origin_cc,
                      },
                  )

                  log(
                      f"  => SUCCESS: Published '{clean_title}' Season {season_number} with {len(valid_ep_ids)} real episodes!"
                  )

              log("\n" + "=" * 65)
              log(f"Anime Automation Finished! Total Series Published/Updated: {published_count}")
              log("=" * 65)

          if __name__ == "__main__":
              main()
          EOF
