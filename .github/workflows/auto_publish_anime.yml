name: CineNova Auto-Publish Anime Series & Movies

on:
  # Har 3 ghante me automatically chalega (100% Free on GitHub Actions)
  schedule:
    - cron: '0 */3 * * *'
  # GitHub Actions tab se 1-click manual run ke liye
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target Anime Website URL (Default: https://www.rareanimes.mov)'
        required: false
        default: 'https://www.rareanimes.mov'
      max_items:
        description: 'Kitne anime posts scrape karne hain (Default: 45)'
        required: false
        default: '45'

jobs:
  sync-anime-to-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper firebase-admin lxml

      - name: Scrape Anime Series (All Seasons/Episodes) & Auto-Publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_ID: "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841"
          ANIME_SITE_URL: ${{ github.event.inputs.site_url || 'https://www.rareanimes.mov' }}
          MAX_ANIME_PER_RUN: ${{ github.event.inputs.max_items || '45' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u - << 'EOF'
          #!/usr/bin/env python3
          import html
          import json
          import os
          import re
          import sys
          import time
          import warnings
          from urllib.parse import quote_plus, urljoin

          # Suppress library warnings
          warnings.filterwarnings("ignore")

          # Force instant unbuffered live output in GitHub Actions
          if hasattr(sys.stdout, "reconfigure"):
              sys.stdout.reconfigure(line_buffering=True)
          if hasattr(sys.stderr, "reconfigure"):
              sys.stderr.reconfigure(line_buffering=True)

          import firebase_admin
          from bs4 import BeautifulSoup
          from firebase_admin import credentials, firestore
          import requests

          DEFAULT_SITE_URL = os.environ.get("ANIME_SITE_URL", "https://www.rareanimes.mov").rstrip("/")
          FIREBASE_DATABASE_ID = os.environ.get(
              "FIREBASE_DATABASE_ID",
              "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841",
          )
          MAX_ANIME_PER_RUN = int(os.environ.get("MAX_ANIME_PER_RUN", 45))

          USER_AGENT = (
              "Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/126.0.0.0 Mobile Safari/537.36"
          )

          # Blocklist: Tokusatsu / Power Rangers / Cartoons to strictly EXCLUDE (Only pure Anime allowed)
          BLOCKED_KEYWORDS = [
              # Power Rangers / Tokusatsu / Live Action
              "power ranger",
              "power rangers",
              "dino fury",
              "cosmic fury",
              "beast morphers",
              "ninja steel",
              "dino charge",
              "megaforce",
              "super megaforce",
              "kamen rider",
              "ryukendo",
              "ultraman",
              # Dragon Ball & Western Cartoons
              "dragon ball",
              "dragonball",
              "dragon ball z",
              "dragon ball super",
              "dragon ball gt",
              "dragon ball daima",
              "tom and jerry",
              "tom & jerry",
              "tom jerry",
              "ben 10",
              "ben10",
              "oggy",
              "courage the cowardly dog",
              "dexter's laboratory",
              "dexters laboratory",
              "adventure time",
              "johnny test",
              "horrid henry",
              "supa strikas",
              "teen titans",
              "powerpuff",
              "generator rex",
              "jackie chan adventures",
              "winx club",
              "dc super hero",
              "chhota bheem",
              "motu patlu",
              "bandbudh aur budbak",
              "roll no 21",
          ]

          def is_title_blocked(text_or_url: str) -> bool:
              if not text_or_url:
                  return False
              norm = re.sub(r"[-_&.+:]+", " ", str(text_or_url).lower())
              norm = re.sub(r"\s+", " ", norm).strip()
              for kw in BLOCKED_KEYWORDS:
                  kw_norm = re.sub(r"[-_&.+:]+", " ", kw.lower()).strip()
                  if kw_norm and kw_norm in norm:
                      return True
              return False

          def log(msg: str):
              print(msg, flush=True)

          def create_http_session():
              try:
                  import cloudscraper
                  session = cloudscraper.create_scraper(
                      browser={"browser": "chrome", "platform": "android", "desktop": False}
                  )
              except Exception:
                  session = requests.Session()

              session.headers.update(
                  {
                      "User-Agent": USER_AGENT,
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Referer": f"{DEFAULT_SITE_URL}/",
                  }
              )
              return session

          def init_firestore_db():
              raw_service_account = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "").strip()
              if not raw_service_account:
                  log("ERROR: FIREBASE_SERVICE_ACCOUNT secret is empty! Add it in GitHub Settings -> Secrets.")
                  sys.exit(1)

              service_account_dict = json.loads(raw_service_account)
              log(f"Authenticated with Firebase Project: {service_account_dict.get('project_id')}")
              cred = credentials.Certificate(service_account_dict)
              if not firebase_admin._apps:
                  firebase_admin.initialize_app(cred)

              candidates = [
                  FIREBASE_DATABASE_ID,
                  "ai-studio-android-devbuild-a9589065-5570-4074-a613-1c0430bf6841",
                  "(default)",
              ]
              seen = set()
              for db_id in candidates:
                  if not db_id or db_id in seen:
                      continue
                  seen.add(db_id)
                  try:
                      client = firestore.client(database_id=db_id)
                      list(client.collection("titles").limit(1).stream())
                      log(f"Successfully connected to Firestore Database ID: '{db_id}'")
                      return client
                  except Exception as e:
                      log(f"[Info] Database '{db_id}' not accessible ({e}), trying next...")

              return firestore.client(database_id=FIREBASE_DATABASE_ID)

          def sanitize_anime_title(raw_title: str):
              text = html.unescape(re.sub(r"<[^>]+>", "", raw_title or "")).strip()

              s_m = re.search(r"\b(?:Season|S)\s*0*(\d{1,2})\b", text, re.I)
              season_number = int(s_m.group(1)) if s_m else 1

              y_m = re.search(r"\b((?:19|20)\d{2})\b", text)
              year = int(y_m.group(1)) if y_m else 2026

              language = "Hindi Dubbed"
              if re.search(r"Dual\s*Audio|Multi\s*Audio| Tamil| Telugu", text, re.I):
                  language = "Multi Audio (Hindi)"
              elif re.search(r"Hindi\s*Sub", text, re.I):
                  language = "Japanese (Hindi Sub)"

              clean = re.sub(r"[\(\[]\s*(?:19|20)\d{2}\s*[\)\]]", "", text, flags=re.I)
              clean = re.sub(r"[\(\[]\s*(?:Season|S)\s*\d+.*", "", clean, flags=re.I)
              clean = re.sub(r"\b(?:Season|S)\s*\d+.*", "", clean, flags=re.I)
              clean = re.sub(
                  r"\b(?:Hindi\s*Dubbed|Hindi\s*Subbed|Hindi|Tamil|Telugu|Dual\s*Audio|Multi\s*Audio|Episodes?\s*Download|Download\s*HD|All\s*Episodes|Watch\s*Download|Download\s*480p.*)\b.*",
                  "",
                  clean,
                  flags=re.I,
              )

              for opener, closer in [("(", ")"), ("[", "]"), ("{", "}")]:
                  if opener in clean and closer not in clean:
                      clean = clean.split(opener, 1)[0]

              clean = re.sub(r"[\(\[\{\)\]\}\-–—:|/\\,\.]+$", "", clean).strip()
              clean = re.sub(r"^[\(\[\{\)\]\}\-–—:|/\\,\.]+", "", clean).strip()
              clean = re.sub(r"\s{2,}", " ", clean)

              display_title = clean or text[:60].strip()
              return display_title, season_number, language, year

          def is_anime_movie_post(raw_title: str, post_html: str, post_url: str, raw_ep_map: dict) -> bool:
              if len(raw_ep_map) > 1:
                  return False
              text = html.unescape(raw_title or "")
              url_lower = (post_url or "").lower()
              has_season_tag = bool(re.search(r"\b(?:Season|S)\s*0*\d+\b", text, re.I)) or bool(
                  re.search(r"season-\d+", url_lower)
              )
              has_episodes_word = bool(re.search(r"\bEpisodes?\b", text, re.I)) or "episodes" in url_lower
              has_ep_headings = len(re.findall(r"Episode\s*0*\d+", post_html, flags=re.I)) >= 2
              if has_season_tag or has_episodes_word or has_ep_headings:
                  return False
              if re.search(r"\b(?:Movie|Film)\b", text, re.I) or "/movies/" in url_lower or "-movie-" in url_lower:
                  return True
              if not re.search(r"Episode\s*0*1\b", post_html, flags=re.I) and len(raw_ep_map) == 1:
                  return True
              return False

          def resolve_codedew_to_hubcloud(session, codedew_url: str, post_url: str = ""):
              try:
                  req_headers = {"Referer": post_url or f"{DEFAULT_SITE_URL}/"}
                  r1 = session.get(codedew_url, headers=req_headers, timeout=10)
                  if not r1.ok:
                      return None

                  h1 = r1.text
                  direct_hub = re.findall(r"href=[\x27\"](https?://[^/]*hubcloud[^\x27\"]+)[\x27\"]", h1, re.I)
                  if direct_hub:
                      return html.unescape(direct_hub[0])

                  step1_links = re.findall(r"data-href=[\x27\"]([^\x27\"]+)[\x27\"]", h1)
                  if not step1_links:
                      step1_links = re.findall(r"href=[\x27\"]([^\x27\"]*ad_done=1[^\x27\"]*)[\x27\"]", h1)
                  if not step1_links:
                      return None

                  step2_url = urljoin(codedew_url, html.unescape(step1_links[0]))
                  r2 = session.get(step2_url, headers={"Referer": codedew_url}, timeout=10)
                  if not r2.ok:
                      return None

                  h2 = r2.text
                  step2_links = re.findall(r"data-href=[\x27\"]([^\x27\"]+)[\x27\"]", h2)
                  for candidate in step2_links:
                      target = html.unescape(candidate)
                      if "hubcloud" in target.lower():
                          return target

                  direct_hub2 = re.findall(r"href=[\x27\"](https?://[^/]*hubcloud[^\x27\"]+)[\x27\"]", h2, re.I)
                  if direct_hub2:
                      return html.unescape(direct_hub2[0])
              except Exception as e:
                  log(f"  [Warn] Failed resolving codedew link {codedew_url[:50]}: {e}")

              return None

          def extract_raw_hubcloud_episode_map(post_html: str):
              """
              Pure in-memory regex parser: extracts ({ep_num: [urls]}, {ep_num: title})
              - STRICTLY EXCLUDES 'Untouched CR' / 'Untouched' 1GB+ uncompressed links.
              - Extracts real episode name from post text (e.g. 'Episode 01 – The Future Is in Our Hands').
              """
              episodes_raw = {}
              episodes_titles = {}
              blocks = re.split(r"(Episode\s*0*\d+[^<\n]*)", post_html, flags=re.I)
              current_ep = 1
              found_any_ep_heading = False

              for block in blocks:
                  ep_m = re.match(r"^Episode\s*0*(\d+)(?:\s*[-–—:]\s*(.+))?", block.strip(), re.I)
                  if ep_m:
                      current_ep = int(ep_m.group(1))
                      raw_title = (ep_m.group(2) or "").strip()
                      clean_name = re.sub(r"<[^>]+>", "", raw_title).strip()
                      clean_name = re.sub(r"[\-–—\s]+$", "", clean_name).strip()
                      clean_name = re.sub(r"\b(?:new!?|hd)\b", "", clean_name, flags=re.I).strip()
                      clean_name = re.sub(r"[\-–—\s]+$", "", clean_name).strip()
                      if clean_name and "untouched" not in clean_name.lower():
                          episodes_titles[current_ep] = clean_name
                      found_any_ep_heading = True
                  else:
                      if not found_any_ep_heading and len(blocks) > 1:
                          continue

                      sub_units = re.findall(r"<p[^>]*>.*?</p>|<div[^>]*>.*?</div>|[^<\n]+", block, re.S)
                      if not sub_units:
                          sub_units = [block]

                      for unit in sub_units:
                          unit_text = re.sub(r"<[^>]+>", " ", unit).lower()
                          # CRITICAL: STRICTLY EXCLUDE UNTOUCHED CR LINKS (1GB+ FILES)
                          if "untouched" in unit_text:
                              continue

                          a_tags = re.findall(
                              r"<a\s+[^>]*href=[\x27\"](https?://codedew\.com/[^\x27\"]+)[\x27\"][^>]*>((?:(?!</a>)[\s\S])*)</a>",
                              unit,
                              re.I,
                          )
                          hub_links = [
                              href
                              for href, inner in a_tags
                              if "hubcloud" in re.sub(r"<[^>]+>", "", inner).lower()
                              and "untouched" not in re.sub(r"<[^>]+>", "", inner).lower()
                              and "untouched" not in href.lower()
                          ]
                          if hub_links:
                              episodes_raw.setdefault(current_ep, []).extend(hub_links)

              # Single Anime Movie fallback
              if not episodes_raw:
                  a_tags = re.findall(
                      r"<a\s+[^>]*href=[\x27\"](https?://codedew\.com/[^\x27\"]+)[\x27\"][^>]*>((?:(?!</a>)[\s\S])*)</a>",
                      post_html,
                      re.I,
                  )
                  hub_links = [
                      href
                      for href, inner in a_tags
                      if "hubcloud" in re.sub(r"<[^>]+>", "", inner).lower()
                      and "untouched" not in re.sub(r"<[^>]+>", "", inner).lower()
                      and "untouched" not in href.lower()
                  ]
                  if hub_links:
                      episodes_raw[1] = hub_links

              return episodes_raw, episodes_titles

          def resolve_anime_episodes(session, raw_ep_map: dict, existing_season_eps: dict, post_url: str):
              resolved_episodes = {}
              log(f"  => Found {len(raw_ep_map)} episodes on page.")

              for ep_num in sorted(raw_ep_map.keys()):
                  if ep_num in existing_season_eps and "hubcloud" in existing_season_eps[ep_num].lower():
                      resolved_episodes[ep_num] = existing_season_eps[ep_num]
                      log(f"    [Ep {ep_num:02d}] Already in database -> {existing_season_eps[ep_num][:45]}...")
                      continue

                  candidates = raw_ep_map[ep_num]
                  real_hubcloud = None
                  seen_c = set()
                  for codedew_link in reversed(candidates):
                      if codedew_link in seen_c:
                          continue
                      seen_c.add(codedew_link)
                      real_hubcloud = resolve_codedew_to_hubcloud(session, codedew_link, post_url)
                      if real_hubcloud and "hubcloud" in real_hubcloud.lower():
                          break

                  if real_hubcloud and "hubcloud" in real_hubcloud.lower():
                      resolved_episodes[ep_num] = real_hubcloud
                      log(f"    [Ep {ep_num:02d}] Resolved HubCloud -> {real_hubcloud}")
                  else:
                      log(f"    [Ep {ep_num:02d}] Link pending on website, skipped.")

              return resolved_episodes

          def fetch_anime_post_details(session, post_url: str):
              try:
                  r = session.get(post_url, timeout=12)
                  if not r.ok:
                      return None
                  html_text = r.text
                  soup = BeautifulSoup(html_text, "lxml")

                  title_tag = soup.find("h1") or soup.find("title")
                  raw_title = title_tag.get_text(" ", strip=True) if title_tag else ""

                  og_img = soup.find("meta", property="og:image")
                  poster = og_img["content"].strip() if og_img and og_img.get("content") else ""

                  og_desc = soup.find("meta", property="og:description")
                  synopsis = og_desc["content"].strip() if og_desc and og_desc.get("content") else ""

                  return {
                      "url": post_url,
                      "html": html_text,
                      "raw_title": raw_title,
                      "poster": poster,
                      "synopsis": synopsis,
                  }
              except Exception as e:
                  log(f"  [Warn] Failed fetching post {post_url}: {e}")
                  return None

          def collect_target_anime_urls(session, base_url: str):
              anime_cat_url = f"{base_url}/category/animes"
              log(f"Scanning pure Anime category across {anime_cat_url}/ pages...")
              seen = set()
              collected = []

              pages_to_check = [f"{anime_cat_url}/"] + [f"{anime_cat_url}/page/{i}/" for i in range(2, 12)]
              for page_url in pages_to_check:
                  if len(collected) >= MAX_ANIME_PER_RUN:
                      break
                  try:
                      r = session.get(page_url, timeout=12)
                      if not r.ok:
                          continue

                      articles = re.findall(r"<article[\s\S]*?</article>", r.text, re.I)
                      for art in articles:
                          m = re.search(
                              r"href=[\x27\"](https?://(?:www\.)?rareanimes\.mov/[^\x27\"#?]+)[\x27\"]",
                              art,
                              re.I,
                          )
                          if not m:
                              continue
                          clean_url = m.group(1).split("?")[0].rstrip("/") + "/"
                          if clean_url in seen or is_title_blocked(clean_url):
                              continue
                          if any(
                              k in clean_url
                              for k in (
                                  "all-anime-cartoon",
                                  "wp-content",
                                  "wp-json",
                                  "feed",
                                  "comments",
                                  "home",
                                  "category",
                                  "contact",
                                  "privacy",
                                  "dmca",
                                  "disclaimer",
                                  "about",
                              )
                          ):
                              continue
                          seen.add(clean_url)
                          collected.append(clean_url)
                          if len(collected) >= MAX_ANIME_PER_RUN:
                              break
                  except Exception as e:
                      log(f"  [Warn] Error checking page {page_url}: {e}")

              log(f"Total pure anime posts collected automatically: {len(collected)}")
              return collected, seen

          def discover_all_seasons_for_series(session, base_url: str, clean_title: str, post_html: str, seen_urls: set):
              """
              Discovers ALL companion seasons:
              1. Scans direct links from post HTML (e.g. naruto-shippuden-season-01..17).
              2. Queries WordPress search with pagination (pages 1..3).
              """
              if is_title_blocked(clean_title):
                  return []

              discovered = []
              clean_slug = re.sub(r"[^a-z0-9]+", "-", clean_title.lower()).strip("-")

              # Step 1: Scan direct links from the post HTML itself
              if post_html:
                  direct_links = re.findall(
                      r"href=[\x27\"](https?://(?:www\.)?rareanimes\.mov/[^\x27\"#?]+)[\x27\"]",
                      post_html,
                      re.I,
                  )
                  for dl in direct_links:
                      clean_u = dl.split("?")[0].rstrip("/") + "/"
                      if clean_u in seen_urls or is_title_blocked(clean_u):
                          continue
                      if (clean_slug in clean_u.lower() or "season" in clean_u.lower()) and re.search(r"season[-_]?0*\d+", clean_u, re.I):
                          seen_urls.add(clean_u)
                          discovered.append(clean_u)

              # Step 2: Query WordPress search with pagination
              query = quote_plus(clean_title)
              for p in range(1, 4):
                  search_url = f"{base_url}/?s={query}" if p == 1 else f"{base_url}/page/{p}/?s={query}"
                  try:
                      r = session.get(search_url, timeout=10)
                      if not r.ok:
                          continue
                      articles = re.findall(r"<article[\s\S]*?</article>", r.text, re.I)
                      for art in articles:
                          m = re.search(
                              r"href=[\x27\"](https?://(?:www\.)?rareanimes\.mov/[^\x27\"#?]+)[\x27\"]",
                              art,
                              re.I,
                          )
                          if not m:
                              continue
                          clean_url = m.group(1).split("?")[0].rstrip("/") + "/"
                          if clean_url in seen_urls or is_title_blocked(clean_url):
                              continue
                          seen_urls.add(clean_url)
                          discovered.append(clean_url)
                  except Exception:
                      break

              return discovered

          def load_fast_existing_anime(titles_ref):
              log("Checking existing anime database...")
              existing_anime = {}
              try:
                  for doc in titles_ref.stream():
                      d = doc.to_dict() or {}
                      t_name = d.get("title", "")
                      # Auto-delete if user has blocked this title
                      if is_title_blocked(t_name) or is_title_blocked(doc.id):
                          log(f"  [Auto-Cleanup] Deleting blocked anime from CineNova: '{t_name}' ({doc.id})")
                          try:
                              for ep_doc in titles_ref.document(doc.id).collection("episodes").stream():
                                  ep_doc.reference.delete()
                              doc.reference.delete()
                              log(f"  [Auto-Cleanup] Successfully removed '{t_name}'.")
                          except Exception as ce:
                              log(f"  [Warn] Failed deleting blocked document: {ce}")
                          continue

                      g = d.get("genres", [])
                      if not ("Anime" in g or "Animation" in g or doc.id.startswith("anime_")):
                          continue

                      existing_anime[doc.id] = {
                          "id": doc.id,
                          "title": t_name,
                          "seasonCount": int(d.get("seasonCount", 1) or 1),
                          "videoUrl": str(d.get("videoUrl", "")),
                      }
                  log(f"Database ready: {len(existing_anime)} anime series found.")
              except Exception as e:
                  log(f"[Warn] Error checking anime in Firestore: {e}")

              return existing_anime

          def main():
              log("=" * 65)
              log("CineNova Automated Anime Scraper & Auto-Publisher (HubCloud Batch)")
              log("=" * 65)

              db = init_firestore_db()
              session = create_http_session()
              titles_ref = db.collection("titles")

              existing_anime = load_fast_existing_anime(titles_ref)
              target_urls, seen_urls = collect_target_anime_urls(session, DEFAULT_SITE_URL)
              log(f"Target anime series to process: {len(target_urls)}")

              published_count = 0
              searched_series_titles = set()
              idx = 0

              while idx < len(target_urls):
                  post_url = target_urls[idx]
                  idx += 1
                  if is_title_blocked(post_url):
                      log(f"\n[{idx}/{len(target_urls)}] [Blocked URL] Skipping {post_url}")
                      continue

                  log(f"\n[{idx}/{len(target_urls)}] Processing: {post_url}")
                  details = fetch_anime_post_details(session, post_url)
                  if not details or not details["raw_title"]:
                      continue

                  clean_title, season_number, language, year = sanitize_anime_title(details["raw_title"])
                  if is_title_blocked(clean_title) or is_title_blocked(details["raw_title"]):
                      log(f"  [Filter Blocked] Skipping '{clean_title}' (User filter: Tom & Jerry / Dragon Ball)")
                      continue
                  slug = re.sub(r"[^a-z0-9]+", "_", clean_title.lower()).strip("_")
                  doc_id = f"anime_{slug}"[:60]

                  # Parse HubCloud episode buttons from post HTML in memory (0 network calls)
                  raw_ep_map, raw_ep_titles = extract_raw_hubcloud_episode_map(details["html"])
                  if not raw_ep_map:
                      log(f"  [Skip] No HubCloud links available on page for '{clean_title}'.")
                      continue

                  # Discover all companion seasons (e.g. Naruto Shippuden Seasons 1 to 17)
                  if clean_title.lower() not in searched_series_titles:
                      searched_series_titles.add(clean_title.lower())
                      related_urls = discover_all_seasons_for_series(session, DEFAULT_SITE_URL, clean_title, details["html"], seen_urls)
                      if related_urls:
                          log(f"  [Multi-Season Discovery] Found {len(related_urls)} companion season posts for '{clean_title}'!")
                          target_urls.extend(related_urls)

                  # Fetch existing episodes for this specific season only (fast single query)
                  existing_season_eps = {}
                  try:
                      for ep_doc in titles_ref.document(doc_id).collection("episodes").where("seasonNumber", "==", season_number).stream():
                          ep_d = ep_doc.to_dict() or {}
                          e_num = int(ep_d.get("episodeNumber", 1) or 1)
                          s_url = str(ep_d.get("streamUrl") or ep_d.get("videoUrl") or "").strip()
                          if s_url:
                              existing_season_eps[e_num] = s_url
                  except Exception:
                      pass

                  # Skip only if all episodes already present in Firestore
                  if existing_season_eps and all(ep in existing_season_eps for ep in raw_ep_map.keys()):
                      log(
                          f"  [Already Added] Anime '{clean_title}' Season {season_number} has all {len(raw_ep_map)} episodes in CineNova. Skipping!"
                      )
                      continue

                  episodes_map = resolve_anime_episodes(
                      session, raw_ep_map, existing_season_eps, post_url
                  )

                  if not episodes_map:
                      log(f"  [Skip] Could not resolve any HubCloud episodes for '{clean_title}'.")
                      continue

                  poster = details["poster"] or "drawable://img_hero_nebula"
                  sorted_eps = sorted(episodes_map.keys())
                  first_stream = episodes_map[sorted_eps[0]]
                  current_seasons = existing_anime.get(doc_id, {}).get("seasonCount", 1)

                  genres = ["Anime", "Animation", "Action", "Fantasy", "Adventure"]
                  titles_ref.document(doc_id).set(
                      {
                          "authorId": "github_automation",
                          "type": "series",
                          "title": clean_title[:200],
                          "description": (
                              details["synopsis"]
                              or f"Watch and download {clean_title} Season {season_number} in {language} with full offline support."
                          )[:2000],
                          "poster": poster[:500],
                          "backdrop": poster[:500],
                          "genres": genres,
                          "cast": ["Original Japanese & Hindi Voice Cast"],
                          "director": "Anime Studio Release",
                          "language": language[:50],
                          "year": year,
                          "rating": 8.8,
                          "ageRating": "U/A 13+",
                          "duration": f"Season {season_number}",
                          "trailerUrl": first_stream[:500],
                          "videoUrl": first_stream[:500],
                          "subtitles": ["English", "Hindi"],
                          "audioTracks": ["Hindi", "Japanese"],
                          "isFeatured": (published_count < 4),
                          "isTrending": (published_count < 12),
                          "isNewRelease": True,
                          "isUpcoming": False,
                          "isPublished": True,
                          "viewsCount": 0,
                          "seasonCount": max(current_seasons, season_number),
                          "createdAt": firestore.SERVER_TIMESTAMP,
                          "updatedAt": firestore.SERVER_TIMESTAMP,
                      },
                      merge=True,
                  )

                  episodes_col = titles_ref.document(doc_id).collection("episodes")
                  valid_ep_ids = set()

                  for ep_num, stream_url in episodes_map.items():
                      ep_doc_id = f"s{season_number}_ep{ep_num}"
                      valid_ep_ids.add(ep_doc_id)
                      ep_title = raw_ep_titles.get(ep_num) or f"Episode {ep_num}"
                      episodes_col.document(ep_doc_id).set(
                          {
                              "titleId": doc_id,
                              "seasonNumber": season_number,
                              "episodeNumber": ep_num,
                              "title": ep_title[:200],
                              "description": f"{clean_title} - Season {season_number}, Episode {ep_num}: {ep_title}"[:500],
                              "thumbnail": poster[:500],
                              "duration": "24m",
                              "videoUrl": stream_url[:500],
                              "streamUrl": stream_url[:500],
                              "isPublished": True,
                              "createdAt": firestore.SERVER_TIMESTAMP,
                              "updatedAt": firestore.SERVER_TIMESTAMP,
                          },
                          merge=True,
                      )

                  published_count += 1
                  existing_anime.setdefault(
                      doc_id,
                      {
                          "id": doc_id,
                          "title": clean_title,
                          "seasonCount": max(current_seasons, season_number),
                          "videoUrl": first_stream,
                      },
                  )

                  log(
                      f"  => SUCCESS: Published '{clean_title}' Season {season_number} with {len(valid_ep_ids)} real HubCloud episodes!"
                  )

              log("\n" + "=" * 65)
              log(f"Anime Automation Finished! Total Series Published/Updated: {published_count}")
              log("=" * 65)

          if __name__ == "__main__":
              main()
          EOF
